[spec]
name = "NTT DATA NDM24"
version = 1

[protocol]
latch_assert = 0x01
tx_assert = 0x00
tx_release = 0x80
rx_present_mask = 0x80
rx_present_asserted = 0x80
status_transfer_hint_mask = 0x40
reset_command = 0x52

[driver]
poll_budget = 32
ring_storage_size = 256
ring_capacity = 255
reset_guard_frames = 600
probe_timeout_frames = 300
probe_retry_limit = 3

[terminal]
columns = 32
rows = 64
queue_storage_size = 256
queue_capacity = 255
render_budget = 32
tilemap_base = 0x4000
tilemap_mask = 0x07ff
scroll_anchor = 0x00d9
bg1sc = 0x42
palette_background = 0x0000
palette_foreground = 0x6f7b
palette_unused_2 = 0x0000
palette_unused_3 = 0x0000

[diagnostic]
magic = [0x4e, 0x44, 0x4d, 0x32]
version = 2
size = 128
trace_event_size = 16
trace_capacity = 256
trace_size = 4096

[[diagnostic.fields]]
name = "magic"
offset = 0
size = 4
type = "bytes"
description = "ASCII NDM2"

[[diagnostic.fields]]
name = "version"
offset = 4
size = 2
type = "u16"
description = "Diagnostic ABI version"

[[diagnostic.fields]]
name = "size"
offset = 6
size = 2
type = "u16"
description = "Diagnostic block size"

[[diagnostic.fields]]
name = "snapshot_sequence"
offset = 8
size = 4
type = "u32"
description = "Even when the snapshot is stable"

[[diagnostic.fields]]
name = "driver_state"
offset = 12
size = 1
type = "u8"
description = "Current modem state"

[[diagnostic.fields]]
name = "flags"
offset = 13
size = 1
type = "u8"
description = "Sticky driver flags"

[[diagnostic.fields]]
name = "last_error"
offset = 14
size = 1
type = "u8"
description = "Last error code"

[[diagnostic.fields]]
name = "last_discard_reason"
offset = 15
size = 1
type = "u8"
description = "Reason the most recent RX candidate was discarded"

[[diagnostic.fields]]
name = "poll_tick"
offset = 16
size = 1
type = "u8"
description = "Advisory VBlank poll request; may change outside the snapshot sequence"

[[diagnostic.fields]]
name = "trace_frozen"
offset = 17
size = 1
type = "u8"
description = "Non-zero when trace recording is frozen"

[[diagnostic.fields]]
name = "rx_read_index"
offset = 18
size = 1
type = "u8"
description = "RX ring read index"

[[diagnostic.fields]]
name = "rx_write_index"
offset = 19
size = 1
type = "u8"
description = "RX ring write index"

[[diagnostic.fields]]
name = "tx_read_index"
offset = 20
size = 1
type = "u8"
description = "TX ring read index"

[[diagnostic.fields]]
name = "tx_write_index"
offset = 21
size = 1
type = "u8"
description = "TX ring write index"

[[diagnostic.fields]]
name = "last_rx_byte"
offset = 22
size = 1
type = "u8"
description = "Last accepted RX byte"

[[diagnostic.fields]]
name = "last_tx_byte"
offset = 23
size = 1
type = "u8"
description = "Last byte clocked to the NDM24 interface"

[[diagnostic.fields]]
name = "last_data_report"
offset = 24
size = 2
type = "u16"
description = "Raw Data1 report"

[[diagnostic.fields]]
name = "last_status_report"
offset = 26
size = 2
type = "u16"
description = "Raw Data2 report"

[[diagnostic.fields]]
name = "trace_next_sequence"
offset = 28
size = 4
type = "u32"
description = "Sequence assigned to the next trace event"

[[diagnostic.fields]]
name = "rx_accepted"
offset = 32
size = 4
type = "u32"
description = "Accepted receive bytes"

[[diagnostic.fields]]
name = "rx_discarded"
offset = 36
size = 4
type = "u32"
description = "Discarded receive candidates"

[[diagnostic.fields]]
name = "tx_bytes"
offset = 40
size = 4
type = "u32"
description = "Bytes clocked to the NDM24 interface"

[[diagnostic.fields]]
name = "rx_overflow"
offset = 44
size = 4
type = "u32"
description = "RX ring overflow count"

[[diagnostic.fields]]
name = "tx_overflow"
offset = 48
size = 4
type = "u32"
description = "TX ring overflow count"

[[diagnostic.fields]]
name = "poll_budget_yield"
offset = 52
size = 4
type = "u32"
description = "Poll budget yield count"

[[diagnostic.fields]]
name = "timeout"
offset = 56
size = 4
type = "u32"
description = "Timeout count"

[[diagnostic.fields]]
name = "reinitialize"
offset = 60
size = 4
type = "u32"
description = "Initialization request count"

[[diagnostic.fields]]
name = "trace_overwritten"
offset = 64
size = 4
type = "u32"
description = "Trace events written after the first full ring"

[[diagnostic.fields]]
name = "reset_start_frame"
offset = 68
size = 4
type = "u32"
description = "Frame at which the R command was sent"

[[diagnostic.fields]]
name = "terminal_dropped"
offset = 72
size = 4
type = "u32"
description = "Oldest display-mirror bytes discarded to retain newer output"

[[diagnostic.fields]]
name = "at_status"
offset = 76
size = 1
type = "u8"
description = "Current generic AT transaction status"

[[diagnostic.fields]]
name = "at_expected_result"
offset = 77
size = 1
type = "u8"
description = "Result code expected by the generic AT transaction"

[[diagnostic.fields]]
name = "session_last_result"
offset = 78
size = 1
type = "u8"
description = "Most recent parsed AT result code"

[[diagnostic.fields]]
name = "session_line_length"
offset = 79
size = 1
type = "u8"
description = "Bytes currently accumulated by the AT line parser"

[[diagnostic.fields]]
name = "at_start_frame"
offset = 80
size = 4
type = "u32"
description = "Frame at which the current generic AT transaction started"

[mailbox]
magic = [0x4e, 0x44, 0x4d, 0x43]
version = 6
size = 96
argument_size = 32

[[mailbox.fields]]
name = "magic"
offset = 0
size = 4
type = "bytes"
description = "ASCII NDMC"

[[mailbox.fields]]
name = "version"
offset = 4
size = 2
type = "u16"
description = "Mailbox ABI version"

[[mailbox.fields]]
name = "block_size"
offset = 6
size = 2
type = "u16"
description = "Mailbox block size"

[[mailbox.fields]]
name = "host_sequence"
offset = 8
size = 4
type = "u32"
description = "Sequence written last by the host"

[[mailbox.fields]]
name = "processed_sequence"
offset = 12
size = 4
type = "u32"
description = "Last command accepted by the SFC"

[[mailbox.fields]]
name = "command"
offset = 16
size = 1
type = "u8"
description = "Requested command"

[[mailbox.fields]]
name = "status"
offset = 17
size = 1
type = "u8"
description = "Command status"

[[mailbox.fields]]
name = "result"
offset = 18
size = 2
type = "u16"
description = "Command-specific result"

[[mailbox.fields]]
name = "arguments"
offset = 20
size = 32
type = "bytes"
description = "Command arguments"

[[mailbox.fields]]
name = "output"
offset = 52
size = 32
type = "bytes"
description = "Command output; written only by the SFC"

[[mailbox.fields]]
name = "reserved"
offset = 84
size = 12
type = "bytes"
description = "Reserved; must be zero"

[states]
off = 0
resetting = 1
probing = 2
ready = 3
error = 4
at_command = 5
dialing = 6
connected = 7
disconnecting = 8

[flags]
poll_budget_yield = 0x01
rx_overflow = 0x02
tx_overflow = 0x04
timeout = 0x08
trace_overwrite = 0x10

[discard_reasons]
none = 0
full_report = 1
status_not_ready = 2
no_data = 3
rx_overflow = 4

[trace_events]
none = 0
poll16 = 1
transfer9 = 2
rx_accepted = 3
rx_discarded = 4
tx = 5
state = 6
error = 7

[mailbox_commands]
none = 0
initialize = 1
quick_test = 2
clear_trace = 3
freeze_trace = 4
resume_trace = 5
at_transaction = 6
binary_transmit = 7
binary_receive = 8
binary_stress_transmit = 9
ppp_self_test = 10
ppp_receive_start = 11
ppp_receive_stop = 12

[mailbox_status]
idle = 0
pending = 1
running = 2
passed = 3
failed = 4
