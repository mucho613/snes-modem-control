[spec]
name = "NTT DATA NDM24"
version = 1

[protocol]
latch_assert = 0x01
tx_assert = 0x00
tx_release = 0x80
rx_present_mask = 0x80
rx_present_asserted = 0x80
status_transfer_hint_mask = 0x40
reset_command = 0x52

[driver]
poll_budget = 32
ring_storage_size = 256
ring_capacity = 255
reset_guard_frames = 600
probe_timeout_frames = 300
probe_retry_limit = 3

[terminal]
columns = 32
rows = 64
queue_storage_size = 256
queue_capacity = 255
render_budget = 32
tilemap_base = 0x4000
tilemap_mask = 0x07ff
scroll_anchor = 0x00d9
bg1sc = 0x42
palette_background = 0x0000
palette_foreground = 0x6f7b
palette_unused_2 = 0x0000
palette_unused_3 = 0x0000

