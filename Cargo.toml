[workspace]
members = [
    "crates/ndm24-ppp",
    "crates/ndm24-protocol",
    "tools/ndm24-tools",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/mucho613/snes-modem-control"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.41", features = ["derive"] }
futures-util = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
serialport = { version = "4.8.1", default-features = false }
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread", "time", "net"] }
tokio-tungstenite = "0.27.0"
toml = "0.9.2"

[profile.release]
strip = true
